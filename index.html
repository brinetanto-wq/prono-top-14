<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronos Top 14</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://warmvhprnqnbqvaebwv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_I2GHgYNAWtoQivJ_NY2nwg_yAMahkgF";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEFAULT_MATCHES = [
      {
        id: "11111111-1111-1111-1111-111111111111",
        home_team: "Aviron Bayonnais",
        away_team: "RC Toulon",
        kickoff: "2026-09-05T19:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8378.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8389.png"
      },
      {
        id: "22222222-2222-2222-2222-222222222222",
        home_team: "Castres Olympique",
        away_team: "RC Vannes",
        kickoff: "2026-09-05T19:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8381.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/192233.png"
      },
      {
        id: "33333333-3333-3333-3333-333333333333",
        home_team: "LOU Rugby",
        away_team: "ASM Clermont",
        kickoff: "2026-09-05T19:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8384.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8382.png"
      },
      {
        id: "44444444-4444-4444-4444-444444444444",
        home_team: "Montpellier HR",
        away_team: "Section Paloise",
        kickoff: "2026-09-05T19:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8385.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8386.png"
      },
      {
        id: "55555555-5555-5555-5555-555555555555",
        home_team: "Stade Français Paris",
        away_team: "USA Perpignan",
        kickoff: "2026-09-05T19:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8390.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8387.png"
      },
      {
        id: "66666666-6666-6666-6666-666666666666",
        home_team: "Union Bordeaux-Bègles",
        away_team: "Racing 92",
        kickoff: "2026-09-05T21:15:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8380.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8388.png"
      },
      {
        id: "77777777-7777-7777-7777-777777777777",
        home_team: "Stade Rochelais",
        away_team: "Stade Toulousain",
        kickoff: "2026-09-06T21:05:00+02:00",
        home_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8391.png",
        away_logo: "https://images.fotmob.com/image_resources/logo/teamlogo/rugby/8392.png"
      }
    ];

    function formatMatchTime(iso) {
      return new Intl.DateTimeFormat("fr-FR", {
        timeZone: "Europe/Paris",
        weekday: "short",
        day: "numeric",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(iso));
    }

    function App() {
      const [tab, setTab] = React.useState("pronos");
      const [pseudo, setPseudo] = React.useState(localStorage.getItem("prono_pseudo") || "");
      const [matches, setMatches] = React.useState(DEFAULT_MATCHES);
      const [predictions, setPredictions] = React.useState({});
      const [leaderboard, setLeaderboard] = React.useState([]);
      const [adminPass, setAdminPass] = React.useState("");
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [msg, setMsg] = React.useState("");

      const savePseudo = (val) => {
        setPseudo(val);
        localStorage.setItem("prono_pseudo", val);
      };

      const loadMatches = async () => {
        try {
          const { data, error } = await supabase.from("matches").select("*").order("kickoff", { ascending: true });
          if (data && data.length > 0) setMatches(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadPredictions = async () => {
        if (!pseudo.trim()) return;
        try {
          const { data, error } = await supabase.from("predictions").select("*").eq("pseudo", pseudo.trim());
          if (data) {
            const map = {};
            data.forEach(p => { 
              map[p.match_id] = { home: p.home_score, away: p.away_score, points: p.points_earned }; 
            });
            setPredictions(map);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const loadLeaderboard = async () => {
        try {
          const { data, error } = await supabase.from("predictions").select("pseudo, points_earned");
          if (data) {
            const scores = {};
            data.forEach(r => { 
              scores[r.pseudo] = (scores[r.pseudo] || 0) + (r.points_earned || 0); 
            });
            const list = Object.keys(scores)
              .map(k => ({ pseudo: k, total: scores[k] }))
              .sort((a, b) => b.total - a.total);
            setLeaderboard(list);
          }
        } catch (e) {
          console.error(e);
        }
      };

      React.useEffect(() => { 
        loadMatches(); 
        loadLeaderboard(); 
      }, []);

      React.useEffect(() => { 
        loadPredictions(); 
      }, [pseudo]);

      const handlePronoChange = (matchId, side, val) => {
        const num = val.replace(/[^0-9]/g, "").slice(0, 3);
        setPredictions(prev => ({
          ...prev,
          [matchId]: { ...prev[matchId], [side]: num }
        }));
      };

      const submitPronos = async () => {
        if (!pseudo.trim()) { 
          setMsg("⚠️ Renseigne ton pseudo en haut !"); 
          return; 
        }
        const toInsert = [];
        for (const m of matches) {
          const pr = predictions[m.id];
          if (pr && pr.home !== "" && pr.away !== "" && pr.home !== undefined && pr.away !== undefined) {
            toInsert.push({
              pseudo: pseudo.trim(),
              match_id: m.id,
              home_score: parseInt(pr.home, 10),
              away_score: parseInt(pr.away, 10),
              points_earned: 0
            });
          }
        }
        if (toInsert.length === 0) { 
          setMsg("⚠️ Saisis au moins un pronostic complet."); 
          return; 
        }

        const { error } = await supabase
          .from("predictions")
          .upsert(toInsert, { onConflict: "pseudo,match_id" });

        if (error) {
          console.error("Supabase Error:", error);
          setMsg(`Erreur : ${error.message || "écriture refusée"}`);
        } else { 
          setMsg("✅ Pronostics enregistrés avec succès !"); 
          loadPredictions();
          loadLeaderboard(); 
        }
      };

      const saveRealScore = async (matchId, hScore, aScore) => {
        const h = parseInt(hScore, 10);
        const a = parseInt(aScore, 10);
        if (isNaN(h) || isNaN(a)) return;

        await supabase.from("matches").update({ home_score: h, away_score: a, is_finished: true }).eq("id", matchId);
        
        const { data: userPronos } = await supabase.from("predictions").select("*").eq("match_id", matchId);
        if (userPronos) {
          for (const pr of userPronos) {
            let pts = 0;
            if (pr.home_score === h && pr.away_score === a) pts = 5;
            else if (
              (pr.home_score > pr.away_score && h > a) || 
              (pr.home_score < pr.away_score && h < a) || 
              (pr.home_score === pr.away_score && h === a)
            ) {
              pts = 3;
            }
            await supabase.from("predictions").update({ points_earned: pts }).eq("id", pr.id);
          }
        }
        loadMatches();
        loadLeaderboard();
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-6">
          <header className="bg-emerald-800 rounded-2xl p-5 mb-6 text-center shadow-lg border border-emerald-700">
            <h1 className="text-2xl font-black tracking-tight text-white">🏉 PRONOS TOP 14</h1>
            <p className="text-emerald-100 text-sm mt-1">1ère Journée · 5 pts score exact, 3 pts vainqueur</p>
            
            <div className="mt-4 max-w-xs mx-auto">
              <input
                type="text"
                placeholder="Ton pseudo..."
                value={pseudo}
                onChange={(e) => savePseudo(e.target.value)}
                className="w-full text-center px-4 py-2 rounded-xl bg-emerald-950 text-white placeholder-emerald-400 border border-emerald-600 focus:outline-none focus:ring-2 focus:ring-white font-medium"
              />
            </div>
          </header>

          <div className="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800">
            <button onClick={() => setTab("pronos")} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${tab === 'pronos' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Matchs</button>
            <button onClick={() => setTab("leaderboard")} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${tab === 'leaderboard' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Classement</button>
            <button onClick={() => setTab("admin")} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${tab === 'admin' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Admin</button>
          </div>

          {msg && <div className="mb-4 p-3 bg-slate-800 text-emerald-300 border border-emerald-500/30 rounded-xl text-center text-sm font-medium">{msg}</div>}

          {tab === "pronos" && (
            <div>
              <div className="space-y-4">
                {matches.map(m => {
                  const pr = predictions[m.id] || {};
                  return (
                    <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                      <div className="flex justify-between items-center text-xs text-slate-400 mb-3 pb-2 border-b border-slate-800/80">
                        <span className="font-semibold text-slate-300 capitalize">{formatMatchTime(m.kickoff)}</span>
                        {m.is_finished && <span className="bg-emerald-900/60 text-emerald-300 px-2.5 py-0.5 rounded-full font-bold">Terminé : {m.home_score} - {m.away_score}</span>}
                      </div>
                      
                      <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 sm:gap-3">
                        <div className="flex items-center justify-end gap-2 text-right">
                          <span className="text-xs sm:text-sm font-bold leading-tight">{m.home_team}</span>
                          {m.home_logo && (
                            <img 
                              src={m.home_logo} 
                              alt="" 
                              referrerPolicy="no-referrer"
                              className="w-8 h-8 object-contain shrink-0" 
                            />
                          )}
                        </div>

                        <div className="flex items-center gap-1.5 sm:gap-2">
                          <input
                            type="text"
                            inputMode="numeric"
                            maxLength={3}
                            placeholder="-"
                            value={pr.home ?? ""}
                            disabled={m.is_finished}
                            onChange={(e) => handlePronoChange(m.id, "home", e.target.value)}
                            className="w-12 sm:w-14 h-11 text-center bg-slate-950 border border-slate-700 rounded-xl font-bold text-lg text-white disabled:opacity-50 focus:border-emerald-500 focus:outline-none"
                          />
                          <span className="text-slate-500 font-bold">:</span>
                          <input
                            type="text"
                            inputMode="numeric"
                            maxLength={3}
                            placeholder="-"
                            value={pr.away ?? ""}
                            disabled={m.is_finished}
                            onChange={(e) => handlePronoChange(m.id, "away", e.target.value)}
                            className="w-12 sm:w-14 h-11 text-center bg-slate-950 border border-slate-700 rounded-xl font-bold text-lg text-white disabled:opacity-50 focus:border-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div className="flex items-center justify-start gap-2 text-left">
                          {m.away_logo && (
                            <img 
                              src={m.away_logo} 
                              alt="" 
                              referrerPolicy="no-referrer"
                              className="w-8 h-8 object-contain shrink-0" 
                            />
                          )}
                          <span className="text-xs sm:text-sm font-bold leading-tight">{m.away_team}</span>
                        </div>
                      </div>

                      {pr.points !== undefined && m.is_finished && (
                        <div className="mt-2 text-center text-xs font-semibold text-emerald-400">
                          Gain sur ce match : +{pr.points} point{pr.points > 1 ? 's' : ''}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <button
                onClick={submitPronos}
                className="w-full mt-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg transition"
              >
                Enregistrer mes pronostics
              </button>
            </div>
          )}

          {tab === "leaderboard" && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <h2 className="text-lg font-bold mb-4 flex items-center gap-2">🏆 Classement Général</h2>
              {leaderboard.length === 0 ? (
                <p className="text-sm text-slate-500">Aucun point attribué pour l'instant.</p>
              ) : (
                <div className="divide-y divide-slate-800">
                  {leaderboard.map((u, i) => (
                    <div key={u.pseudo} className="py-2.5 flex justify-between items-center text-sm">
                      <span className="flex items-center gap-3">
                        <span className="font-bold text-slate-500 w-5">{i + 1}.</span>
                        <span className={u.pseudo === pseudo ? "font-bold text-emerald-400" : "font-medium"}>{u.pseudo}</span>
                      </span>
                      <span className="font-extrabold text-white">{u.total} pts</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === "admin" && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
              {!isAdmin ? (
                <div className="space-y-3">
                  <p className="text-sm text-slate-300 font-medium">Mot de passe pour saisir les scores réels :</p>
                  <input
                    type="password"
                    placeholder="Mot de passe (top14)"
                    value={adminPass}
                    onChange={(e) => setAdminPass(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white"
                  />
                  <button
                    onClick={() => { 
                      if (adminPass === "top14") setIsAdmin(true); 
                      else alert("Mot de passe incorrect"); 
                    }}
                    className="w-full py-2 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl"
                  >
                    Valider
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  <h3 className="font-bold text-emerald-400">Saisie des résultats réels</h3>
                  {matches.map(m => (
                    <div key={m.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
                      <span className="font-medium text-slate-300">{m.home_team} - {m.away_team}</span>
                      <div className="flex gap-2 items-center">
                        <input 
                          id={`admin-h-${m.id}`} 
                          defaultValue={m.home_score ?? ""} 
                          placeholder="0" 
                          maxLength={3} 
                          className="w-12 h-8 text-center bg-slate-900 border border-slate-700 rounded text-white font-bold" 
                        />
                        <span>:</span>
                        <input 
                          id={`admin-a-${m.id}`} 
                          defaultValue={m.away_score ?? ""} 
                          placeholder="0" 
                          maxLength={3} 
                          className="w-12 h-8 text-center bg-slate-900 border border-slate-700 rounded text-white font-bold" 
                        />
                        <button
                          onClick={() => {
                            const h = document.getElementById(`admin-h-${m.id}`).value;
                            const a = document.getElementById(`admin-a-${m.id}`).value;
                            saveRealScore(m.id, h, a);
                          }}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded font-bold ml-2"
                        >
                          OK
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
