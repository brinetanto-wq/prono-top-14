<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronos Top 14</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-6">

    <!-- En-tête -->
    <header class="bg-emerald-800 rounded-2xl p-5 mb-6 text-center shadow-lg border border-emerald-700">
      <h1 class="text-2xl font-black tracking-tight text-white">🏉 PRONOS TOP 14</h1>
      <p class="text-emerald-100 text-sm mt-1">1ère Journée · 5 pts score exact, 3 pts vainqueur</p>
      <div class="mt-4 max-w-xs mx-auto">
        <input
          id="pseudo-input"
          type="text"
          placeholder="Ton pseudo..."
          class="w-full text-center px-4 py-2 rounded-xl bg-emerald-950 text-white placeholder-emerald-400 border border-emerald-600 focus:outline-none focus:ring-2 focus:ring-white font-medium"
        />
      </div>
    </header>

    <!-- Navigation -->
    <div class="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800">
      <button id="tab-btn-matches" onclick="switchTab('matches')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white">Matchs</button>
      <button id="tab-btn-leaderboard" onclick="switchTab('leaderboard')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white">Classement</button>
      <button id="tab-btn-admin" onclick="switchTab('admin')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white">Admin</button>
    </div>

    <!-- Message d'alerte -->
    <div id="msg-box" class="hidden mb-4 p-3 bg-slate-800 text-emerald-300 border border-emerald-500/30 rounded-xl text-center text-sm font-medium"></div>

    <!-- VUE 1 : Les Matchs -->
    <div id="view-matches">
      <div id="matches-list" class="space-y-4"></div>
      <button
        onclick="submitPronos()"
        class="w-full mt-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg transition"
      >
        Enregistrer mes pronostics
      </button>
    </div>

    <!-- VUE 2 : Le Classement -->
    <div id="view-leaderboard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="text-lg font-bold mb-4">🏆 Classement Général</h2>
      <div id="leaderboard-list" class="divide-y divide-slate-800 text-sm">
        <p class="text-slate-500">Aucun point attribué pour l'instant.</p>
      </div>
    </div>

    <!-- VUE 3 : Admin -->
    <div id="view-admin" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <div id="admin-login" class="space-y-3">
        <p class="text-sm text-slate-300">Mot de passe pour valider les scores officiels :</p>
        <input id="admin-pass" type="password" placeholder="Mot de passe (top14)" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white" />
        <button onclick="checkAdmin()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl">Valider</button>
      </div>
      <div id="admin-panel" class="hidden space-y-4">
        <h3 class="font-bold text-emerald-400">Saisie des résultats réels</h3>
        <div id="admin-matches-list" class="space-y-2"></div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://warmvhprnqnbqvaebwv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_I2GHgYNAWtoQivJ_NY2nwg_yAMahkgF";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MATCHES = [
      { id: "11111111-1111-1111-1111-111111111111", home: "Aviron Bayonnais", away: "RC Toulon", bHome: "AB", bAway: "RCT", cHome: "bg-sky-500 text-white", cAway: "bg-red-700 text-white", time: "Samedi 5 sept. à 19:05" },
      { id: "22222222-2222-2222-2222-222222222222", home: "Castres Olympique", away: "RC Vannes", bHome: "CO", bAway: "RCV", cHome: "bg-blue-800 text-white", cAway: "bg-blue-900 text-blue-200", time: "Samedi 5 sept. à 19:05" },
      { id: "33333333-3333-3333-3333-333333333333", home: "LOU Rugby", away: "ASM Clermont", bHome: "LOU", bAway: "ASM", cHome: "bg-red-600 text-white", cAway: "bg-yellow-400 text-slate-950 font-black", time: "Samedi 5 sept. à 19:05" },
      { id: "44444444-4444-4444-4444-444444444444", home: "Montpellier HR", away: "Section Paloise", bHome: "MHR", bAway: "SP", cHome: "bg-blue-950 text-sky-400 border border-sky-400/30", cAway: "bg-emerald-700 text-white", time: "Samedi 5 sept. à 19:05" },
      { id: "55555555-5555-5555-5555-555555555555", home: "Stade Français Paris", away: "USA Perpignan", bHome: "SFP", bAway: "USAP", cHome: "bg-pink-600 text-white", cAway: "bg-amber-400 text-red-700 font-black", time: "Samedi 5 sept. à 19:05" },
      { id: "66666666-6666-6666-6666-666666666666", home: "Union Bordeaux-Bègles", away: "Racing 92", bHome: "UBB", bAway: "R92", cHome: "bg-rose-950 text-rose-200 border border-rose-800", cAway: "bg-sky-100 text-sky-900 font-bold", time: "Samedi 5 sept. à 21:15" },
      { id: "77777777-7777-7777-7777-777777777777", home: "Stade Rochelais", away: "Stade Toulousain", bHome: "SR", bAway: "ST", cHome: "bg-amber-400 text-black font-black", cAway: "bg-red-600 text-black font-black", time: "Dimanche 6 sept. à 21:05" }
    ];

    let userPredictions = {};
    let realScores = {};

    function showMsg(txt) {
      const b = document.getElementById("msg-box");
      b.innerText = txt;
      b.classList.remove("hidden");
      setTimeout(() => b.classList.add("hidden"), 4000);
    }

    function switchTab(tab) {
      ["matches", "leaderboard", "admin"].forEach(t => {
        document.getElementById(`view-${t}`).classList.add("hidden");
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white";
      });
      document.getElementById(`view-${tab}`).classList.remove("hidden");
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white";

      if (tab === "leaderboard") loadLeaderboard();
    }

    function renderMatches() {
      const container = document.getElementById("matches-list");
      container.innerHTML = MATCHES.map(m => {
        const pr = userPredictions[m.id] || { home: "", away: "", points: null };
        const real = realScores[m.id];
        const isDone = real && real.is_finished;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-3 pb-2 border-b border-slate-800/80">
              <span class="font-semibold text-slate-300 capitalize">${m.time}</span>
              ${isDone ? `<span class="bg-emerald-900/60 text-emerald-300 px-2.5 py-0.5 rounded-full font-bold">Terminé : ${real.home} - ${real.away}</span>` : ""}
            </div>
            <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2 sm:gap-3">
              <div class="flex items-center justify-end gap-2 text-right">
                <span class="text-xs sm:text-sm font-bold leading-tight">${m.home}</span>
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-black shrink-0 ${m.cHome}">${m.bHome}</span>
              </div>
              <div class="flex items-center gap-1.5 sm:gap-2">
                <input
                  id="h-${m.id}"
                  type="text"
                  inputmode="numeric"
                  maxlength="3"
                  value="${pr.home ?? ''}"
                  placeholder="-"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 3)"
                  class="w-12 sm:w-14 h-11 text-center bg-slate-950 border border-slate-700 rounded-xl font-bold text-lg text-white focus:border-emerald-500 focus:outline-none"
                />
                <span class="text-slate-500 font-bold">:</span>
                <input
                  id="a-${m.id}"
                  type="text"
                  inputmode="numeric"
                  maxlength="3"
                  value="${pr.away ?? ''}"
                  placeholder="-"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 3)"
                  class="w-12 sm:w-14 h-11 text-center bg-slate-950 border border-slate-700 rounded-xl font-bold text-lg text-white focus:border-emerald-500 focus:outline-none"
                />
              </div>
              <div class="flex items-center justify-start gap-2 text-left">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-black shrink-0 ${m.cAway}">${m.bAway}</span>
                <span class="text-xs sm:text-sm font-bold leading-tight">${m.away}</span>
              </div>
            </div>
            ${pr.points !== null && isDone ? `<div class="mt-2 text-center text-xs font-semibold text-emerald-400">Gain sur ce match : +${pr.points} pt(s)</div>` : ""}
          </div>
        `;
      }).join("");
    }

    async function loadUserPredictions() {
      const pseudo = document.getElementById("pseudo-input").value.trim();
      if (!pseudo) return;
      localStorage.setItem("prono_pseudo", pseudo);
      try {
        const { data } = await supabase.from("predictions").select("*").eq("pseudo", pseudo);
        if (data) {
          userPredictions = {};
          data.forEach(p => {
            userPredictions[p.match_id] = { home: p.home_score, away: p.away_score, points: p.points_earned };
          });
          renderMatches();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function submitPronos() {
      const pseudo = document.getElementById("pseudo-input").value.trim();
      if (!pseudo) {
        showMsg("⚠️ Renseigne ton pseudo en haut !");
        return;
      }
      const toInsert = [];
      MATCHES.forEach(m => {
        const hVal = document.getElementById(`h-${m.id}`).value;
        const aVal = document.getElementById(`a-${m.id}`).value;
        if (hVal !== "" && aVal !== "") {
          toInsert.push({
            pseudo: pseudo,
            match_id: m.id,
            home_score: parseInt(hVal, 10),
            away_score: parseInt(aVal, 10),
            points_earned: 0
          });
        }
      });

      if (toInsert.length === 0) {
        showMsg("⚠️ Remplis au moins un score !");
        return;
      }

      const { error } = await supabase.from("predictions").upsert(toInsert, { onConflict: "pseudo,match_id" });
      if (error) {
        showMsg(`Erreur : ${error.message}`);
      } else {
        showMsg("✅ Pronostics enregistrés avec succès !");
        loadUserPredictions();
      }
    }

    async function loadLeaderboard() {
      try {
        const { data } = await supabase.from("predictions").select("pseudo, points_earned");
        const list = document.getElementById("leaderboard-list");
        if (data && data.length > 0) {
          const map = {};
          data.forEach(r => { map[r.pseudo] = (map[r.pseudo] || 0) + (r.points_earned || 0); });
          const sorted = Object.keys(map).map(p => ({ pseudo: p, total: map[p] })).sort((a,b) => b.total - a.total);
          list.innerHTML = sorted.map((u, i) => `
            <div class="py-2.5 flex justify-between items-center">
              <span class="flex items-center gap-3">
                <span class="font-bold text-slate-500 w-5">${i + 1}.</span>
                <span class="font-medium text-white">${u.pseudo}</span>
              </span>
              <span class="font-extrabold text-emerald-400">${u.total} pts</span>
            </div>
          `).join("");
        } else {
          list.innerHTML = `<p class="text-slate-500">Aucun point attribué pour l'instant.</p>`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function checkAdmin() {
      const pass = document.getElementById("admin-pass").value;
      if (pass === "top14") {
        document.getElementById("admin-login").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
        renderAdminMatches();
      } else {
        alert("Mot de passe incorrect");
      }
    }

    function renderAdminMatches() {
      const box = document.getElementById("admin-matches-list");
      box.innerHTML = MATCHES.map(m => `
        <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
          <span class="font-medium text-slate-300">${m.home} - ${m.away}</span>
          <div class="flex gap-2 items-center">
            <input id="adm-h-${m.id}" placeholder="0" maxlength="3" class="w-12 h-8 text-center bg-slate-900 border border-slate-700 rounded text-white font-bold" />
            <span>:</span>
            <input id="adm-a-${m.id}" placeholder="0" maxlength="3" class="w-12 h-8 text-center bg-slate-900 border border-slate-700 rounded text-white font-bold" />
            <button onclick="saveMatchScore('${m.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded font-bold ml-2">OK</button>
          </div>
        </div>
      `).join("");
    }

    async function saveMatchScore(matchId) {
      const h = parseInt(document.getElementById(`adm-h-${matchId}`).value, 10);
      const a = parseInt(document.getElementById(`adm-a-${matchId}`).value, 10);
      if (isNaN(h) || isNaN(a)) return;

      realScores[matchId] = { home: h, away: a, is_finished: true };

      const { data: userPronos } = await supabase.from("predictions").select("*").eq("match_id", matchId);
      if (userPronos) {
        for (const pr of userPronos) {
          let pts = 0;
          if (pr.home_score === h && pr.away_score === a) pts = 5;
          else if ((pr.home_score > pr.away_score && h > a) || (pr.home_score < pr.away_score && h < a) || (pr.home_score === pr.away_score && h === a)) pts = 3;
          await supabase.from("predictions").update({ points_earned: pts }).eq("id", pr.id);
        }
      }
      renderMatches();
      showMsg("Score enregistré & points calculés !");
    }

    // Initialisation
    const saved = localStorage.getItem("prono_pseudo");
    if (saved) {
      document.getElementById("pseudo-input").value = saved;
      loadUserPredictions();
    }
    document.getElementById("pseudo-input").addEventListener("change", loadUserPredictions);
    renderMatches();
  </script>
</body>
</html>
